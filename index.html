
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Clock</title>
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 150px;
        }

        h1 {
            color: #60a5fa;
        }

        #clock {
            font-size: 60px;
            font-weight: bold;
            margin: 30px;
        }
    </style>
</head>
<body>
    <h1>My Digital Clock</h1>
    <div id="clock">00:00:00</div>

    <script>
        function showTime() {
            const now = new Date();
            document.getElementById("clock").textContent =
                now.toLocaleTimeString("en-IN");
        }

        showTime();
        setInterval(showTime, 1000);
    </script>
</body>
</html>
